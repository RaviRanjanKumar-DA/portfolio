<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent | Ravi Ranjan Kumar</title>
  <!-- Auto-redirect back to portfolio after 5 seconds -->
  <meta http-equiv="refresh" content="5;url=https://raviranjankumar-da.github.io/portfolio/#contact">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',sans-serif;
      background:#070d1a;
      color:#e2e8f0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }
    .card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      padding:56px 48px;
      max-width:480px;
      width:100%;
      backdrop-filter:blur(12px);
    }
    .icon{
      width:72px;height:72px;border-radius:50%;
      background:rgba(16,185,129,.15);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 24px;
      font-size:32px;color:#10b981;
      box-shadow:0 0 30px rgba(16,185,129,.25);
    }
    h1{
      font-family:'Poppins',sans-serif;
      font-size:26px;font-weight:800;
      color:#f1f5f9;margin-bottom:12px;
    }
    p{font-size:15px;color:#94a3b8;line-height:1.7;margin-bottom:8px}
    .redirect{
      font-size:13px;color:#64748b;margin-top:20px;
    }
    .redirect span{color:#3b82f6;font-weight:600;}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      background:#3b82f6;color:#fff;
      padding:12px 28px;border-radius:10px;
      font-size:14px;font-weight:700;
      text-decoration:none;margin-top:24px;
      transition:background .2s,transform .2s;
      font-family:'Inter',sans-serif;
    }
    .btn:hover{background:#2563eb;transform:translateY(-2px)}
    .logo{
      font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;
      color:#f1f5f9;margin-bottom:32px;
    }
    .logo-b{color:#3b82f6}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="logo-b">&lt;</span>RRK<span class="logo-b">/&gt;</span></div>
    <div class="icon"><i class="fas fa-circle-check"></i></div>
    <h1>Message Sent! 🎉</h1>
    <p>Thank you for reaching out. Your message has been delivered to <strong>Ravi Ranjan Kumar</strong>.</p>
    <p>I'll get back to you within <strong>24 hours</strong>.</p>
    <div class="redirect">Redirecting you back in <span>5 seconds</span>…</div>
    <a href="https://raviranjankumar-da.github.io/portfolio/#contact" class="btn">
      <i class="fas fa-arrow-left"></i> Back to Portfolio
    </a>
  </div>
  <script>
    /* Countdown timer */
    let secs = 5;
    const span = document.querySelector('.redirect span');
    setInterval(() => {
      secs--;
      if (secs > 0) span.textContent = secs + ' seconds';
      else span.textContent = 'now';
    }, 1000);
  </script>
</body>
</html>
